name: Public distribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python main.py demo
      - run: python scripts/check_public.py --history
  explorer:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BUNDLE_URL: /data/local-bundle.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - name: Generate the bundle consumed by the explorer
        run: |
          python main.py demo
          cp task_rep/static/demo/demo-bundle.json explorer/public/data/local-bundle.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: explorer/.nvmrc
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci
        working-directory: explorer
      - run: npm run build
        working-directory: explorer
      - run: npm run lint
        working-directory: explorer
      - run: npx playwright install --with-deps chromium
        working-directory: explorer
      - run: npm run test:smoke
        working-directory: explorer
